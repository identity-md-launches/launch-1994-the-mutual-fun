[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Pinned compiler: every worker and the verifier carry this version offline.
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# The launch compares deployed bytecode without the metadata hash.
bytecode_hash = "none"
cbor_metadata = false

# No foreign-function interface and no filesystem access from tests.
ffi = false
fs_permissions = []

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fuzz]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
